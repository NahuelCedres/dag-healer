name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs of a pull request are cancelled. Runs on main are never cancelled once
# started (a newer push to main only replaces a run that is still queued).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dag-healer with the dev extras
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check src tests scripts
      - name: ruff format --check
        run: python -m ruff format --check src tests scripts

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # The versions in between run on Linux only.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # One command per step: on Windows (pwsh) only the last command can fail a step.
      - name: Install dag-healer with the dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run the unit tests
        run: python -m pytest tests/unit

  ui-bundle:
    name: UI bundle and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Do not ask before downloading the pnpm version pinned in ui/package.json.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Enable corepack (pnpm from ui/package.json)
        run: corepack enable
      # pnpm install --frozen-lockfile, pnpm build (the Airflow plugin bundle) and pnpm
      # build:standalone (the dag-healer serve page), then copy ui/dist/main.umd.cjs and
      # ui/dist/standalone/ into src/dag_healer/api/static/ (over the committed bundles).
      - name: Build the UI bundles
        run: python scripts/tasks.py ui --local
      # A difference means a change of ui/ was committed without both rebuilt bundles. A warning
      # for now: make it fail once the runner's build has been seen to match a local one byte for byte.
      - name: Compare the fresh bundles with the committed ones
        run: |
          changed="$(git status --porcelain -- src/dag_healer/api/static)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::warning::the committed UI bundles differ from a fresh build of ui/: run 'python scripts/tasks.py ui' and commit src/dag_healer/api/static/"
          fi
      # As in docker/Dockerfile; hatch_build.py refuses a wheel without main.umd.cjs.
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      # Both bundles byte-identical to ui/dist, no stale standalone file, and their sizes.
      - name: Check that the wheel ships the new bundles
        shell: python
        run: |
          import gzip
          import zipfile
          from pathlib import Path

          static = "dag_healer/api/static/"
          dist = Path("ui/dist")
          built = {"main.umd.cjs": dist / "main.umd.cjs"}
          for path in sorted((dist / "standalone").rglob("*")):
              if path.is_file():
                  built[path.relative_to(dist).as_posix()] = path
          if "standalone/index.js" not in built:
              raise SystemExit("pnpm build:standalone did not produce ui/dist/standalone/index.js")

          wheel = next(Path("dist").glob("dag_healer-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              for name, path in built.items():
                  if static + name not in names:
                      raise SystemExit(f"{wheel.name} does not ship {static}{name}")
                  if archive.read(static + name) != path.read_bytes():
                      raise SystemExit(f"{wheel.name} ships a {static}{name} not built from ui/")
          stale = sorted(
              name[len(static):]
              for name in names
              if name.startswith(static + "standalone/") and name[len(static):] not in built
          )
          if stale:
              raise SystemExit(f"{wheel.name} ships standalone files the build did not produce: {stale}")

          def size(paths):
              data = b"".join(path.read_bytes() for path in paths)
              return f"{len(data)} bytes, {len(gzip.compress(data, mtime=0))} gzipped"

          standalone = [path for name, path in built.items() if name.startswith("standalone/")]
          print(f"{wheel.name} ships the bundles built from ui/:")
          print(f"  main.umd.cjs: {size([built['main.umd.cjs']])}")
          print(f"  standalone/: {size(standalone)} in {len(standalone)} file(s)")
      # Run in ui/ so corepack picks the pnpm version pinned in ui/package.json.
      - name: Lint the UI (eslint + tsc)
        working-directory: ui
        run: pnpm lint
      - name: Check the UI formatting (prettier)
        working-directory: ui
        run: pnpm format:check
      - name: Run the UI tests (vitest)
        working-directory: ui
        run: pnpm test
