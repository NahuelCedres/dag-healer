name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs of a pull request are cancelled. Runs on main are never cancelled once
# started (a newer push to main only replaces a run that is still queued).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dag-healer with the dev extras
        run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check src tests scripts
      - name: ruff format --check
        run: python -m ruff format --check src tests scripts

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        # The versions in between run on Linux only.
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # One command per step: on Windows (pwsh) only the last command can fail a step.
      - name: Install dag-healer with the dev extras
        run: python -m pip install -e ".[dev]"
      - name: Run the unit tests
        run: python -m pytest tests/unit

  ui-bundle:
    name: UI bundle and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Do not ask before downloading the pnpm version pinned in ui/package.json.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Node.js 22
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Enable corepack (pnpm from ui/package.json)
        run: corepack enable
      # pnpm install --frozen-lockfile, pnpm build, then copy ui/dist/main.umd.cjs to
      # src/dag_healer/api/static/main.umd.cjs (over the committed bundle).
      - name: Build the UI bundle
        run: python scripts/tasks.py ui --local
      # As in docker/Dockerfile; hatch_build.py refuses a wheel without the bundle.
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Check that the wheel ships the new bundle
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("dag_healer-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              shipped = archive.read("dag_healer/api/static/main.umd.cjs")
          built = Path("ui/dist/main.umd.cjs").read_bytes()
          if shipped != built:
              raise SystemExit(f"{wheel.name} does not ship the bundle built from ui/")
          print(f"{wheel.name} ships main.umd.cjs ({len(shipped)} bytes), built from ui/")
