version: 1
dag_id: customers_sync
status: draft
review: required
approved_by: null
approved_at: null
source_hash: null
inferred_from:
  - fixtures/day1/customers.csv (25 rows)
notes: Inferred automatically from sample data. Review dtypes, nullability, numeric ranges (inferred with
