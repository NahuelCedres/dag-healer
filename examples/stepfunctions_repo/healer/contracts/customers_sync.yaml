        dtype: string
        nullable: false
        pii: true
      - name: email
        dtype: string
        nullable: false
        pii: true
      - name: phone
        dtype: string
        nullable: false
        pii: true
      - name: country
        dtype: string
        nullable: false
        pii: false
      - name: signup_date
        dtype: string
        nullable: false
        pii: false
        note: looks like a date (YYYY-MM-DD); inferred as 'string' so other date/time formats are not
          rejected. Change dtype to 'date' or 'datetime' to require ISO-8601 parseable values.
