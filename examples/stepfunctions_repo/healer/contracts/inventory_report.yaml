# Draft contract generated by dag-healer init. Review it and approve it before it is enforced.
version: 1
dag_id: inventory_report
status: draft
review: required
approved_by: null
approved_at: null
source_hash: null
inferred_from:
  - fixtures/day1/inventory.csv (30 rows)
notes: Inferred automatically from sample data. Review dtypes, nullability, numeric ranges (inferred with
  a 10x headroom) and row-count bands before approving.
datasets:
  - name: inventory
    task_id: BuildReport
    locator:
      type: csv
      path: s3://acme-landing/incoming/inventory.csv
    row_count:
      min: 15
      max: 100
    allow_extra_columns: true
    columns:
      - name: sku
        dtype: string
        nullable: false
        pii: false
      - name: warehouse
        dtype: string
        nullable: false
        pii: false
      - name: qty
        dtype: integer
        nullable: false
        min: 0.0
        max: 3100.0
        pii: false
      - name: updated_at
        dtype: datetime
        nullable: false
        pii: false
