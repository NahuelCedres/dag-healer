[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dag-healer"
dynamic = ["version"]
description = "An Airflow 3 plugin that diagnoses failing tasks of your existing DAGs and repairs them: data contracts, masked samples, reproducing tests and pull requests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dag-healer contributors" }]
keywords = ["airflow", "airflow-plugin", "data-quality", "data-contracts", "self-healing", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Framework :: Apache Airflow",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
# Lower bounds are deliberately loose: dag-healer is installed into an existing Airflow
# environment and must never force pip to move Airflow's own pins.
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "pandas>=2.1",
    "pyarrow>=14",
    "anthropic>=1.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.1"]
aws = ["boto3>=1.34"]
serve = ["uvicorn>=0.29", "PyJWT[crypto]>=2.8"]
dev = ["pytest>=8", "aiosmtpd", "ruff", "boto3>=1.34"]   # botocore.stub for the Step Functions tests

[project.scripts]
dag-healer = "dag_healer.cli.main:main"

[project.entry-points."airflow.plugins"]
dag_healer = "dag_healer.airflow.plugin:HealerPlugin"

# Orchestrator adapters (docs/architecture/orchestrators.md, section 5.2). Third-party
# distributions register theirs in the same group; `dag-healer orchestrators list` shows them.
[project.entry-points."dag_healer.orchestrators"]
airflow = "dag_healer.airflow.adapter:FACTORY"
stepfunctions = "dag_healer.stepfunctions:FACTORY"
fake = "dag_healer.orchestrators.fake:FACTORY"

# --------------------------------------------------------------------------- build

[tool.hatch.version]
path = "src/dag_healer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dag_healer"]
# Package data (api/static/*, alerts/templates/*, agent/prompts/*) lives inside the
# package directory and is picked up automatically. The UI bundle is listed as an
# artifact so it is shipped even when a local checkout ignores it in VCS.
artifacts = [
    "src/dag_healer/api/static/*",
    "src/dag_healer/alerts/templates/*",
    "src/dag_healer/agent/prompts/*",
]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: refuses to build a wheel without the UI bundle (see the file).
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

# --------------------------------------------------------------------------- tools

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    ".demo",
    "ui",
    "example_existing_repo",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dag_healer"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Security",
]
