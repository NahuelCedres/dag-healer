# A hand-written phase-5 healer.yaml that sets every section to non-default values
# (frozen fixture of tests/unit/test_config_orchestrator.py; see README.md).
version: 1
x-owner: data platform team
x-ticket: DATA-123

repo:
  path: .
  base_branch: develop
  dags_dir: "./airflow\\dags/"
  tests_dir: tests/
  test_command: "python -m pytest -q -x"
  allowed_paths: src/
  pytest_timeout: 120

airflow:
  api_url: "${HEALER_API_URL:-http://airflow-apiserver:8080/}"
  username: svc-healer
  password: "${HEALER_AIRFLOW_PASSWORD}"

monitor:
  dags: ["sales_*", "customers_*", "!*_tmp"]
  modes: [rest, callback]
  poll_interval_seconds: 45
  trigger: every_failure

contracts:
  dir: contracts

datasets:
  sales_daily_etl:
    extract_sales: {type: csv, path: ./data/in/sales.csv, options: {sep: ";"}}
    load_sales: {type: parquet, path: "data\\out\\sales.parquet"}
  inventory_report:
    get_inventory: {type: json, path: data/inventory.jsonl, options: {lines: true}}

classification:
  min_confidence: 0.6

notify:
  email:
    host: "${HEALER_SMTP_HOST:-smtp.example.com}"
    port: "${HEALER_SMTP_PORT:-2525}"
    from: "Healer <healer@example.com>"
    to: "a@example.com, B Team <b@example.com>"
    starttls: "${HEALER_SMTP_STARTTLS:-true}"
    username: "${HEALER_SMTP_USERNAME}"
    password: "${HEALER_SMTP_PASSWORD}"
  events: [reported, repaired]

github:
  repo: "https://github.com/acme/etl.git"
  pr_base: develop
  token: "${GITHUB_TOKEN}"

llm:
  provider: fake
  model: claude-opus-5-5
  effort: medium
  max_tokens: 8000
  fallbacks: false

limits:
  max_fix_attempts: 2
  max_incidents_per_hour: 5
  max_tokens_per_incident: 200000
  max_diff_files: 4
  max_diff_lines: 150

masking:
  default: redact
  columns: email
  allow: [id, country]
  hook: "acme.masks:mask"
  sample_rows: 3

store:
  url: "${HEALER_DATABASE_URL:-sqlite:///custom.db}"

ingest:
  token: "${HEALER_INGEST_TOKEN}"
  api_url: "http://airflow-apiserver:8080"

debug: "${HEALER_DEBUG:-true}"
