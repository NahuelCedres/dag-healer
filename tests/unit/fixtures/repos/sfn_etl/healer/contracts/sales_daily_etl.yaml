# Draft contract generated by dag-healer init. Review it and approve it before it is enforced.
version: 1
dag_id: sales_daily_etl
status: draft
review: required
approved_by: null
approved_at: null
source_hash: null
inferred_from:
  - fixtures/day1/sales.csv (30 rows)
notes: Inferred automatically from sample data. Review dtypes, nullability, numeric ranges (inferred with
  a 10x headroom) and row-count bands before approving.
datasets:
  - name: sales
    task_id: TransformSales
    locator:
      type: csv
      path: s3://acme-landing/incoming/sales.csv
    row_count:
      min: 15
      max: 100
    allow_extra_columns: true
    columns:
      - name: order_id
        dtype: string
        nullable: false
        pii: false
      - name: customer_email
        dtype: string
        nullable: false
        pii: true
      - name: amount
        dtype: float
        nullable: false
        min: 0.0
        max: 8990.0
        pii: false
      - name: currency
        dtype: string
        nullable: false
        pii: false
      - name: order_date
        dtype: string
        nullable: false
        pii: false
        note: looks like a date (YYYY-MM-DD); inferred as 'string' so other date/time formats are not
          rejected. Change dtype to 'date' or 'datetime' to require ISO-8601 parseable values.
